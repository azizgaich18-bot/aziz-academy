<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>Aziz Academy</title>
  <style>
    body {
      margin: 0;
      font-family: 'Tahoma', sans-serif;
      background-color: #f9f9f9;
      color: #333;
    }
    header {
      background-color: #111;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 15px 40px;
    }
    header img {
      width: 60px;
      height: auto;
    }
    nav a {
      color: white;
      margin: 0 15px;
      text-decoration: none;
      font-weight: bold;
    }
    nav a:hover {
      color: gold;
    }
    .hero {
      background: linear-gradient(to right, #111, #333);
      color: white;
      text-align: center;
      padding: 100px 20px;
    }
    .hero h1 {
      font-size: 48px;
      color: gold;
    }
    .hero p {
      font-size: 20px;
    }
    .section {
      padding: 60px 20px;
      text-align: center;
    }
    .section h2 {
      color: #111;
      margin-bottom: 20px;
    }
    .section p {
      max-width: 600px;
      margin: auto;
      line-height: 1.6;
    }
    footer {
      background-color: #111;
      color: #aaa;
      text-align: center;
      padding: 20px;
    }
  </style>
</head>
<body>
  <header>
    <!-- Logo صغير على الجنب -->
    <img src="Image2.png" alt="Aziz Academy Logo">
    <nav>
      <a href="#">الرئيسية</a>
      <a href="#">من نحن؟</a>
      <a href="#">البرامج</a>
      <a href="#">الموارد</a>
      <a href="#">اتصل بنا</a>
    </nav>
  </header>

  <div class="hero">
    <h1>Aziz Academy</h1>
    <p>منصة تعليمية حديثة تجمع بين الطب والعلم والمعرفة.</p>
  </div>

  <div class="section">
    <h2>من نحن؟</h2>
    <p>أكاديمية عزيز هي فضاء تعليمي حديث يهدف إلى تكوين الطلبة في المجالات الطبية والعلمية، مع موارد رقمية ودروس تفاعلية.</p>
  </div>

  <footer>
    © 2026 Aziz Academy – جميع الحقوق محفوظة
  </footer>
</body>
</html>
